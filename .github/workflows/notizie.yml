# Copia ogni 10 minuti i nuovi post del canale pubblico t.me/starwarsita
# nella sezione notizie/ del sito. Legge solo la pagina pubblica del canale.
name: Notizie dal canale Telegram
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: notizie
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 pillow
      - run: python scripts/telegram_notizie.py
      - name: Salva solo se ci sono novita'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A notizie
          if git diff --cached --quiet; then echo "nessuna novita'"; exit 0; fi
          git commit -m "Notizie: aggiornamento dal canale Telegram"
          git push
