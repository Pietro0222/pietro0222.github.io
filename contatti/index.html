:root{
  --void:#03070d;--holo:#6fd9ff;--holo-dim:#2b6f8c;--ink:#d9f3ff;--ink-dim:#7fa9bd;
  --amber:#ffb85c;--line:rgba(111,217,255,.28);--panel:rgba(6,18,28,.78);
  --f-display:'Oxanium','Rajdhani','Segoe UI',system-ui,sans-serif;
  --f-data:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--void)}
body{min-height:100vh;display:flex;flex-direction:column;background:var(--void);color:var(--ink);font-family:var(--f-data);font-size:14px;line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 55% at 50% 40%,rgba(111,217,255,.10),transparent 70%),
             radial-gradient(ellipse 40% 30% at 50% 42%,rgba(43,111,140,.12),transparent 75%)}
.scan{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(0deg,rgba(111,217,255,.025) 0 1px,transparent 1px 3px)}
.vign{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse 90% 70% at 50% 45%,transparent 40%,rgba(3,7,13,.85) 100%)}
.wrap{position:relative;z-index:2;max-width:1240px;margin:0 auto;padding:0 32px;width:100%}
.back{display:inline-block;margin-top:28px;font-family:var(--f-display);font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-dim);padding:6px 12px;border:1px solid var(--line);transition:color .2s,background-color .2s,border-color .2s}
.back:hover,.back:focus-visible{color:var(--void);background:var(--holo);border-color:var(--holo)}
.hero{padding-top:9vh;padding-bottom:6vh;text-align:center}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(34px,6.4vw,84px);line-height:.95;letter-spacing:.16em;
  color:#eafaff;text-shadow:0 0 22px rgba(111,217,255,.55),0 0 70px rgba(111,217,255,.25);margin-right:-.16em}
.aur{margin-top:16px;font:400 clamp(11px,1.4vw,16px)/1 'AurebeshCanon',sans-serif;letter-spacing:.42em;color:var(--ink-dim);text-transform:uppercase;margin-right:-.42em}
main{flex:1}
.card{max-width:640px;margin:0 auto 64px;background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--holo);
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);padding:30px 32px 32px}
.label{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--holo-dim)}
h2{font-family:var(--f-display);font-weight:600;font-size:24px;letter-spacing:.12em;color:#eafaff;margin-top:6px}
.mail{display:inline-flex;align-items:center;gap:12px;margin-top:18px;max-width:100%;
  font-family:var(--f-display);font-size:clamp(15px,2.6vw,20px);letter-spacing:.04em;color:var(--holo);
  padding:12px 18px;border:1px solid var(--holo);overflow-wrap:anywhere;transition:background-color .2s,color .2s}
.mail svg{flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6}
.mail:hover,.mail:focus-visible{background:var(--holo);color:var(--void)}
.sep{height:1px;margin:28px 0 22px;background:linear-gradient(90deg,var(--line),transparent)}
.canali{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.canale{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border:1px solid var(--line);color:var(--ink);
  font-family:var(--f-display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;transition:border-color .2s,color .2s,filter .2s}
.canale svg{width:20px;height:20px;fill:currentColor;color:var(--ink-dim);transition:color .2s}
.canale:hover,.canale:focus-visible{border-color:var(--holo);color:var(--holo)}
.canale:hover svg,.canale:focus-visible svg{color:var(--holo);filter:drop-shadow(0 0 6px rgba(111,217,255,.7))}
footer{position:relative;z-index:2;border-top:1px solid var(--line);color:var(--ink-dim);font-size:11.5px;letter-spacing:.06em}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:18px;padding-bottom:22px}
@media (max-width:560px){
  .wrap{padding:0 16px}
  .card{padding:24px 20px 26px;margin-bottom:44px}
  .hero{padding-top:40px;padding-bottom:34px}
  .mail{font-size:13.5px;padding:12px 14px;gap:10px;overflow-wrap:normal}
  footer .wrap{flex-direction:column;gap:10px}
}
@media (max-width:360px){.mail{font-size:12px;padding:10px 12px;gap:8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
footer .wrap{align-items:center}
.foot-links{display:flex;align-items:center;gap:16px}
.foot-links a{display:inline-flex;align-items:center;color:var(--ink-dim);transition:color .2s,filter .2s}
.foot-contact{font-family:var(--f-display);font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:6px 12px;border:1px solid var(--line)}
.foot-contact:hover,.foot-contact:focus-visible{color:var(--void);background:var(--holo);border-color:var(--holo)}
.foot-social svg{width:20px;height:20px;fill:currentColor}
.foot-social:hover,.foot-social:focus-visible{color:var(--holo);filter:drop-shadow(0 0 6px rgba(111,217,255,.7))}
.foot-links a:focus-visible{outline:2px solid var(--holo);outline-offset:3px}
@media (max-width:560px){footer .wrap{align-items:flex-start}}
</style>
</head>
